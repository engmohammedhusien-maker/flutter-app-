name: laravel_flutter_app
description: A new Flutter project with Riverpod and Laravel API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Networking
  dio: ^5.4.0
  # Routing
  go_router: ^13.0.0
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  # JSON Serialization
  json_annotation: ^4.8.1
  # Utilities
  freezed_annotation: ^2.4.1
  # Localization (optional)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  # Changed from 0.18.1 to match flutter_localizations requirement
    # Firebase
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.0
  # Local Notifications (لإظهار إشعار داخل التطبيق)
  flutter_local_notifications: ^18.0.0
  lottie: ^3.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  # Testing
  mocktail: ^1.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
  # أضف هذا القسم لضمان إعدادات l10n
  # l10n:
  #   arb-dir: lib/l10n
  #   template-arb-file: app_en.arb
  #   output-localization-file: app_localizations.dart